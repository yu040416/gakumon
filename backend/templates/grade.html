{% extends "base.html" %}
{% block title %}{{ info.title }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/grade.css') }}">{% endblock %}
{% block content %}
<h1>{{ info.title }}</h1>
<div class="unit-list">
    {% for name, active in info.units %}
    <div class="unit-card {{ '' if active else 'unit-disabled' }}">
        <h3>{{ name }}</h3>
        {% if active %}
        <a class="unit-btn" href="{{ url_for('chat', unit=name, grade=grade) }}">教える</a>
        {% else %}
        <span class="unit-btn unit-btn-off">準備中</span>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endblock %}
