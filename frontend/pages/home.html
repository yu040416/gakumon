<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ガクモン ホーム</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>

    <!-- サイドバー -->
    <div class="sidebar">

        <div class="logo">
            ガクモン
        </div>

        <div class="menu">
            <a href="#" class="active">ホーム</a>
            <a href="#">モンスター</a>
            <a href="#">学習履歴</a>
            <a href="#">図鑑</a>
        </div>

    </div>

    <!-- メイン画面 -->
    <div class="content">

        <h1>きょうは何を教える？</h1>

        <div class="monster-card">
            <h3>タマゴ</h3>

            <div class="exp-bar">
                <div class="exp-fill"></div>
            </div>

            <p>経験値 12 / 30</p>
        </div>

        <h2>単元カード</h2>

        <div class="unit-list">

            <div class="unit-card">
                <h3>正の数・負の数</h3>
                <p>おすすめ 1番目</p>
                <p>テスト：まだ受けていません</p>
                <button class="teach-btn">教える</button>
            </div>

            <div class="unit-card">
                <h3>文字式</h3>
                <p>おすすめ 2番目</p>
                <p>テスト：まだ受けていません</p>
                <button class="teach-btn">教える</button>
            </div>

            <div class="unit-card">
                <h3>一次方程式</h3>
                <p>おすすめ 3番目</p>
                <p>テスト：まだ受けていません</p>
                <button class="teach-btn">教える</button>
            </div>

        </div>

    </div>

</body>
</html>
