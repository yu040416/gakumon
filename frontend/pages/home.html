<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ガクモン ホーム</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>

    <!-- サイドバー -->
    <div class="sidebar">

        <div class="logo">
            ガクモン
        </div>

        <div class="menu">
            <a href="#" class="active">ホーム</a>
            <a href="#">モンスター</a>
            <a href="#">学習履歴</a>
            <a href="#">図鑑</a>
        </div>

    </div>

    <!-- メイン画面 -->
    <div class="content">

        <h1>きょうは何を教える？</h1>

        <!-- モンスターカード -->
        <div class="monster-card">

            <h3>タマゴ</h3>

            <div class="exp-bar">
                <div class="exp-fill"></div>
            </div>

            <p>経験値 12 / 30</p>

        </div>

        <h2>学年を選択</h2>

        <div class="grade-list">

            <div class="grade-card">

                <h3>中学1年</h3>

                <button
                class="grade-btn"
                onclick="moveGrade(1)">
                選択
                </button>

            </div>

            <div class="grade-card">

                <h3>中学2年</h3>

                <button
                class="grade-btn"
                onclick="moveGrade(2)">
                選択
                </button>

            </div>

            <div class="grade-card">

                <h3>中学3年</h3>

                <button
                class="grade-btn"
                onclick="moveGrade(3)">
                選択
                </button>

            </div>

        </div>

    </div>

    <script src="../js/home.js"></script>
</body>

</html>
